# Netlify build for the web frontend.
#
# Netlify serves the static site only. The Python backend cannot run here —
# Netlify's functions are JavaScript, TypeScript and Go, and there is no Python
# runtime — so recognition and translation come from a separate host, named by
# VITE_API_BASE below.
#
# NO SECRETS IN THIS FILE. It is committed. The Gemini keys belong in the
# backend host's environment, never in the frontend's build, because Vite
# inlines every VITE_ variable into the JavaScript it ships.

[build]
  base    = "web/frontend"
  command = "npm run build"
  publish = "web/frontend/dist"

[build.environment]
  NODE_VERSION = "20"
  # Netlify serves from the domain root, unlike GitHub Pages which serves a
  # project site from /<repo>/. Without this the build would inherit the
  # /iSuara/ default from vite.config.ts and every asset would 404.
  VITE_BASE = "/"

# Set VITE_API_BASE in the Netlify UI (Site configuration -> Environment
# variables) to the backend's origin, e.g. https://isuara-api.onrender.com.
# Left unset the site still deploys and the camera, skeleton, expression
# reading, 3D avatar and speech all work; only recognition and translation are
# absent, exactly as they are on any backendless build.

# A single-page app: every path has to return the app shell rather than a 404,
# or a refresh on a deep link breaks. Status 200 so it is a rewrite, not a
# redirect.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
